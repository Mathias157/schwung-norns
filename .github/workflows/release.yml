name: Release Norns module

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.4.3). Must already exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Verify tag matches module version
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.ref }}
        run: |
          TAG_VERSION="${RELEASE_VERSION#v}"
          MODULE_VERSION="$(jq -r '.version' src/module.json)"
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "Tag ${TAG_VERSION} does not match module.json ${MODULE_VERSION}" >&2
            exit 1
          fi

      - name: Build module
        run: ./scripts/build.sh

      - name: Publish module archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          files: dist/norns-module.tar.gz

      - name: Update Store release metadata
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > release.json <<EOF
          {
            "version": "${VERSION}",
            "download_url": "https://github.com/${REPOSITORY}/releases/download/${RELEASE_VERSION}/norns-module.tar.gz",
            "repo_url": "https://github.com/${REPOSITORY}",
            "requires": "Requires RNBO Takeover and a one-time Norns Debian chroot setup; see the repository README.",
            "post_install": "One-time setup: ssh root@move.local 'sh /data/UserData/schwung/modules/tools/norns/bootstrap-norns.sh'"
          }
          EOF
          git add release.json
          git commit -m "chore: update release metadata for ${RELEASE_VERSION}" || exit 0
          git push origin main
